name: Proposer une amélioration
description: Expliquer un besoin ou proposer une évolution du projet.
title: "[Proposition] "
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Quel usage souhaitez-vous rendre possible ou plus simple ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Décrire la solution et, si possible, son impact sur un Pi Zero W de 512 Mo.
    validations:
      required: true
